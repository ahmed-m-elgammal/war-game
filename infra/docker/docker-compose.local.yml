# Local development PostgreSQL service for WARGAME local dev and test runner
services:
  postgres:
    image: postgres:17-alpine
    container_name: wargame-local-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wargame
    ports:
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wargame"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
