name: CI Quality & Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Typecheck, Lint, Format & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js (v24.22.1)
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate task register integrity
        run: pnpm run validate:tasks

      - name: Validate domain parity & data integrity
        run: pnpm run validate:domain

      - name: Typecheck project references
        run: pnpm run typecheck

      - name: Lint codebase
        run: pnpm run lint

      - name: Verify architecture constraints (No God Files ≤350 LOC & No Raw Colors)
        run: pnpm run check:rules

      - name: Check code formatting
        run: pnpm run format:check

      - name: Run unit test suite
        run: pnpm run test

      - name: Build packages and apps
        run: pnpm run build

  security-scan:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Dependency vulnerability audit
        run: pnpm audit --prod --audit-level high

      - name: Secret Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
